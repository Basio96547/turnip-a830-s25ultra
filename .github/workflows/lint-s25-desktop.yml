name: Lint s25-desktop

on:
  push:
    paths:
      - 's25-desktop/**'
      - '.github/workflows/lint-s25-desktop.yml'
  pull_request:
    paths:
      - 's25-desktop/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تثبيت أدوات الفحص
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: فحص نحوي لكل سكربتات bash
        run: |
          fail=0
          while IFS= read -r f; do
            if bash -n "$f"; then
              echo "✓ $f"
            else
              echo "✗ $f"; fail=1
            fi
          done < <(find s25-desktop -type f \( -name '*.sh' -o -path 's25-desktop/container/bin/*' \))
          exit $fail

      - name: shellcheck
        run: |
          # SC1091: لا يمكن تتبّع ملفات تُقرأ في وقت التشغيل (env.sh داخل الحاوية)
          # SC2154: متغيرات تأتي من تلك الملفات
          shellcheck --severity=warning --external-sources \
            --exclude=SC1091,SC2154 \
            s25-desktop/install.sh \
            s25-desktop/lib/common.sh \
            s25-desktop/termux/*.sh \
            s25-desktop/container/*.sh \
            s25-desktop/container/bin/* \
            s25-desktop/container/etc/*.sh
