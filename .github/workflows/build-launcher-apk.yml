name: Build S25 Desktop launcher APK

# يبني تطبيق التشغيل (APK) الذي يفتح النظام من الشاشة الرئيسية.
# الناتج: artifact في صفحة Actions، وعند التشغيل اليدوي يمكن نشره كـ Release
# ليصبح له رابط تحميل مباشر يعمل من الجوال.

on:
  push:
    paths:
      - 's25-launcher/**'
      - '.github/workflows/build-launcher-apk.yml'
  pull_request:
    paths:
      - 's25-launcher/**'
  workflow_dispatch:
    inputs:
      make_release:
        description: 'نشر الحزمة كـ Release (رابط تحميل مباشر)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: تهيئة JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تهيئة Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: تهيئة Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: بناء APK
        working-directory: s25-launcher
        run: gradle --no-daemon assembleDebug

      - name: معلومات الحزمة
        id: apk
        run: |
          BUILT="s25-launcher/app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$BUILT" ] || { echo "❌ لم يتم إنتاج APK"; exit 1; }
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          # الحزمة المنشورة هي الملف المعتمد في المستودع، لا ناتج CI:
          # مفتاح debug يُولَّد لكل جهاز بناء، فلو نشرنا ناتج CI لاختلف التوقيع عن
          # الحزمة الموجودة في المستودع وفشل التثبيت فوقها برسالة «التطبيق غير مثبت».
          # بناء CI يبقى مفيداً: يتحقق أن المصدر يُترجم بلا أخطاء.
          PREBUILT="s25-launcher/prebuilt/S25-Desktop-launcher.apk"
          OUT="S25-Desktop-launcher.apk"
          if [ -f "$PREBUILT" ]; then
            cp "$PREBUILT" "$OUT"
            echo "📦 سيتم نشر الحزمة المعتمدة من المستودع"
          else
            cp "$BUILT" "$OUT"
            echo "📦 لا توجد حزمة معتمدة — سيتم نشر ناتج CI"
          fi

          ls -lh "$OUT"
          sha256sum "$OUT" | tee sha256.txt
          "$AAPT" dump badging "$OUT" | grep -E "^package:|uses-permission|launchable-activity" || true
          "$APKSIGNER" verify -v --print-certs "$OUT" | grep -E "Verifies|scheme|certificate SHA-256" || true

          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 sha256.txt)" >> "$GITHUB_OUTPUT"
          echo "version=$("$AAPT" dump badging "$OUT" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")" >> "$GITHUB_OUTPUT"

      - name: رفع الحزمة كـ artifact
        uses: actions/upload-artifact@v4
        with:
          name: S25-Desktop-launcher-apk
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 60
          compression-level: 0

      - name: نشر Release (تشغيل يدوي فقط)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.make_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="launcher-v${{ steps.apk.outputs.version }}-r${{ github.run_number }}"
          NOTES=$(mktemp)
          {
            echo "# تطبيق S25 Desktop — مُشغّل برامج ويندوز على الجوال"
            echo ""
            echo "تطبيق أندرويد صغير (~32 كيلوبايت) يضع أيقونة على الشاشة الرئيسية،"
            echo "تشغّل بضغطة واحدة وتنقلك تلقائياً إلى شاشة العرض:"
            echo ""
            echo "- **Claude Desktop (ويندوز .exe)** — النسخة الرسمية عبر Wine + box64 + DXVK"
            echo "- **Chrome (ويندوز .exe)** — حزمة Google Chrome الرسمية"
            echo "- سطح مكتب XFCE الكامل · شاشة العرض · تشخيص النظام · إيقاف الكل"
            echo ""
            echo "الضغط الطويل على الأيقونة يعطي اختصارات يمكن سحبها كأيقونات مستقلة."
            echo ""
            echo "## المطلوب قبل الاستخدام"
            echo "1. حمّل \`S25-Desktop-launcher.apk\` وثبّته"
            echo "   (على سامسونج: أوقف **Auto Blocker** من الإعدادات ▸ الأمان والخصوصية)"
            echo "2. ثبّت **Termux** (من F-Droid لا Play Store) و **Termux:X11** (APK)"
            echo "3. داخل Termux مرة واحدة — يثبّت الحاوية وTurnip وطبقة ويندوز:"
            echo '   ```'
            echo '   git clone https://github.com/basio96547/turnip-a830-s25ultra'
            echo '   bash turnip-a830-s25ultra/s25-desktop/install.sh'
            echo '   ```'
            echo "4. افتح التطبيق واضغط الزر الذي تريده"
            echo ""
            echo "> أول تشغيل لبرنامج ويندوز ينزّل مُثبّته الرسمي داخل بيئة ويندوز — قد يأخذ دقائق."
            echo ""
            echo "الدليل: [docs/WINDOWS.md](https://github.com/Basio96547/turnip-a830-s25ultra/blob/main/s25-desktop/docs/WINDOWS.md)"
            echo ""
            echo "## التحقق من الملف"
            echo '```'
            echo "sha256  ${{ steps.apk.outputs.sha256 }}"
            echo '```'
            echo ""
            echo "> موقّعة بمفتاح debug بمخططَي v2 و v3 (كافٍ للتثبيت اليدوي، غير مناسب"
            echo "> لمتجر Play). إن كانت لديك نسخة أقدم فأزلها قبل التثبيت — تواقيع debug"
            echo "> تختلف بين نسخ البناء."
          } > "$NOTES"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "S25 Desktop Launcher ${{ steps.apk.outputs.version }} (build #${{ github.run_number }})" \
            --notes-file "$NOTES" \
            "${{ steps.apk.outputs.apk }}"
