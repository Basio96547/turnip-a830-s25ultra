plugins {
    id 'com.android.application'
}

android {
    namespace 'com.s25.desktop.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.s25.desktop.launcher'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        // نفعّل مخططات التوقيع الثلاثة صراحةً: بعض أجهزة سامسونج/أندرويد ترفض
        // الحزم الموقّعة بمخطط واحد فقط عند التثبيت اليدوي
        debug {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    // نبني نسخة debug فقط: هي القابلة للتثبيت يدوياً بلا مفتاح إصدار
    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// بلا كتلة dependencies: التطبيق يستخدم واجهات أندرويد الأساسية فقط،
// فتبقى الحزمة ~29 كيلوبايت والبناء بلا مفاجآت.
